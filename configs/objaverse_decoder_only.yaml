model:
  class_name: model.decoder_only.DecoupledNVSDecoder
  image_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 3
  pose_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 6
  target_pose_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 6
  transformer:
    d: 768
    d_head: 64
    n_layer: 12
  irepa:
    decoder_depth: 3
    dino_layer: 7
    feature_dim: 768
    image_size: 448
    interpolate_mode: bilinear

training:
  amp_dtype: bf16
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 8
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 5
  center_crop: true
  scene_scale_factor: 1.35
  checkpoint_dir: ./experiments/checkpoints/objaverse_decoder_only
  checkpoint_every: 2000
  eval_every: 0
  dataset_name: data.dataset_objaverse.Dataset
  dataset_path: path_to_objaverse_scene_lists/objaverse/full_list.txt
  objaverse_root: path_to_objaverse_rendered_data/
  da3_cache_root: path_to_objaverse_da3_cache/objaverse
  objaverse_fovy_deg: 49.1
  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 5.0
  scheduler_type: constant
  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 1.0
  dino_loss_weight: 0.5
  dino_gamma: 0.60
  spatial_loss_weight: 0.5
  spatial_temperature: 0.1
  spatial_gamma: 1.0
  spatial_alpha: 0.2
  spatial_min_valid: 50
  spatial_layer: 9
  lr: 0.0004
  train_steps: 50000
  num_input_views: 4
  num_target_views: 8
  num_views: 12
  num_threads: 8
  num_workers: 16
  prefetch_factor: 32
  print_every: 20
  square_crop: true
  target_has_input: true
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 23
    min_frame_dist: 2
  view_window_frames: 16
  wandb_exp_name: objaverse_decoder_only
  wandb_log_every: 50
  wandb_project: DecoupledNVS
  warmup: 2500
  weight_decay: 0.05
  use_irepa: true
  use_spatial: true

inference:
  if_inference: false
  compute_metrics: false
  view_idx_file_path: null
  render_video: false
  render_video_config:
    traj_type: interpolate
    num_frames: 60
    loop_video: true
    order_poses: false
  test_dataset_path: path_to_objaverse_scene_lists/abo_render_f/full_list.txt
  test_objaverse_root: path_to_objaverse_eval_rendered_data/abo_render_f
  test_da3_cache_root: path_to_objaverse_da3_cache/abo_render_f
